[package]
name = "fy-i18n-lang-tag"
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
description = "Lightweight modern BCP 47 language tag parsing, normalization, and matching (no_std, Safe Rust)"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["bcp47", "rfc5646", "language-tag", "i18n", "localization"]
categories = ["internationalization", "localization", "parser-implementations"]
repository = "https://github.com/Fengyang-Conglomerate/fy-i18n-lang-tag"

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1", default-features = false, optional = true }

[features]
default = []
alloc = ["serde?/alloc"]
serde = ["dep:serde"]
unsafe = []

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
